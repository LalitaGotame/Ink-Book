<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink Book</title>
<meta name="theme-color" content="#EEF0EF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Book">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: studio day-book. One column of sections on a stone ground, bottom tab bar, slide-up sheets for every form. Two columns from tablet width. */
:root{
  --bg:#EEF0EF; --card:#FFFFFF; --ink:#1C1F24; --muted:#5D656E; --line:#D9DEDC; --soft:#E3E8E6;
  --red:#C2362F; --red-ink:#FFFFFF; --red-soft:#F7DEDB;
  --teal:#1F6F6B; --teal-ink:#FFFFFF; --teal-soft:#D6EBE8;
  --gold:#B7860F; --gold-soft:#F7EBC9;
  --display:"Alfa Slab One","Rockwell","Georgia",serif;
  --body:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121517; --card:#1B2023; --ink:#ECEFEE; --muted:#9BA4A9; --line:#2C3337; --soft:#242B2F;
  --red:#F0675E; --red-ink:#1B0F0E; --red-soft:#4A2421;
  --teal:#4FB3AC; --teal-ink:#0E1F1E; --teal-soft:#1E3A38;
  --gold:#F2C14E; --gold-soft:#463A17; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121517; --card:#1B2023; --ink:#ECEFEE; --muted:#9BA4A9; --line:#2C3337; --soft:#242B2F;
  --red:#F0675E; --red-ink:#1B0F0E; --red-soft:#4A2421;
  --teal:#4FB3AC; --teal-ink:#0E1F1E; --teal-soft:#1E3A38;
  --gold:#F2C14E; --gold-soft:#463A17; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--gold-soft);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.demo span{flex:1;min-width:200px}

.grid{display:grid;gap:16px}
@media (min-width:860px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sechead h2{flex:1;font-size:18px;font-weight:800}
.count{font-weight:800;font-size:13px;background:var(--soft);border-radius:999px;padding:2px 9px;color:var(--muted)}
.empty{color:var(--muted);font-weight:500;padding:6px 2px;margin:0}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:none;text-align:left;border-radius:18px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-weight:700;font-size:13px;color:var(--muted)}
.stat.hot{background:var(--red-soft);border-color:transparent}
.stat.hot b{color:var(--red)}
.stat.good b{color:var(--teal)}

/* list rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);min-width:0}
.list .row:first-child{border-top:none}
.row.tap{cursor:pointer;border-left:none;border-right:none;border-bottom:none;background:none;text-align:left;width:100%}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-weight:800;font-variant-numeric:tabular-nums;min-width:62px;font-size:15px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.red{color:var(--red)}.amt.teal{color:var(--teal)}

.plat{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--muted)}
.plat.instagram{background:#F6DDE8;color:#9C2A5C}
.plat.tiktok{background:#D8F2F2;color:#0D6B6B}
.plat.whatsapp{background:#DDF3DF;color:#21753A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plat.instagram{background:#4A2333;color:#F5A9C9}:root:not([data-theme="light"]) .plat.tiktok{background:#163C3C;color:#8FE3E3}:root:not([data-theme="light"]) .plat.whatsapp{background:#1C3D23;color:#9BE0A8}}
:root[data-theme="dark"] .plat.instagram{background:#4A2333;color:#F5A9C9}:root[data-theme="dark"] .plat.tiktok{background:#163C3C;color:#8FE3E3}:root[data-theme="dark"] .plat.whatsapp{background:#1C3D23;color:#9BE0A8}

.badge{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.badge.warn{background:var(--gold-soft);color:var(--gold)}
.badge.hot{background:var(--red-soft);color:var(--red)}
.badge.ok{background:var(--teal-soft);color:var(--teal)}

.btn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.btn.teal{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.end{justify-content:flex-end}

.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;border:none;border-radius:20px;padding:15px 20px;background:var(--red);color:var(--red-ink);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fab svg{width:22px;height:22px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:130px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-weight:700;font-size:12px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:18px;height:18px;border-radius:999px;background:var(--red);color:var(--red-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* filters + inputs */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label,.field .lab{font-weight:700;font-size:14px}
.field .hint{color:var(--muted);font-size:13px;margin:0}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;min-height:46px}
textarea.inp{min-height:76px;resize:vertical}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:24px 24px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
@media (min-width:860px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px;max-height:88vh}}
.sheethead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sheethead .ttl{flex:1;min-width:0}
.sheethead h2{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.sheethead p{margin:4px 0 0;color:var(--muted);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block{border-top:1.5px solid var(--line);padding-top:14px;margin-top:14px}
.block h3{font-size:15px;font-weight:800;margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--soft);border:none;padding:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .tag{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}
.addphoto{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;text-align:center;padding:6px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:700;line-height:1}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.confirm{background:var(--red-soft);border-radius:14px;padding:12px;margin-top:10px}
.confirm p{margin:0 0 10px;font-weight:700}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:80vh;border-radius:8px}
.viewer .btns{margin-top:14px}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{flex:1;text-align:center;font-size:18px;font-weight:800}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wk span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day{aspect-ratio:1;max-width:100%;border:none;background:none;border-radius:12px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 2px var(--red)}
.day.sel{background:var(--ink);color:var(--bg)}
.day .pips{display:flex;gap:2px;height:6px}
.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.day.sel .pips i{background:var(--bg)}
.day.past{color:var(--muted)}

/* stock */
.stockrow .qty{font-family:var(--display);font-weight:400;font-size:24px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.stockrow .qty.low{color:var(--red)}
.money-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.money-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* auth */
.auth{max-width:420px;margin:8vh auto 0;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:24px 20px}
.auth h1{font-family:var(--display);font-weight:400;font-size:34px;margin-bottom:6px}
.auth p{color:var(--muted);margin:0 0 18px}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin:0 0 10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);font-weight:700;padding:11px 18px;border-radius:999px;max-width:92vw;text-align:center}
@media (max-width:400px){.stat b{font-size:22px}.brand h1{font-size:22px}.kv{grid-template-columns:90px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
